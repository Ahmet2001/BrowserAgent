<circle class="tw" cx="600" cy="150" r="1.2" fill="#cfe6ff" style="animation-duration:3.51s;animation-delay:2.26s"/>

<circle class="ring" cx="400" cy="235" r="66"/>
<circle class="ring" cx="400" cy="235" r="66" style="animation-delay:1.6s"/>

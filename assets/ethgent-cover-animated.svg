<circle class="tw" cx="40" cy="120" r="2.0" fill="#cfe6ff" style="animation-duration:3.87s;animation-delay:1.23s"/>
<circle class="tw" cx="770" cy="90" r="1.2" fill="#cfe6ff" style="animation-duration:3.43s;animation-delay:0.41s"/>

<circle class="tw" cx="560" cy="55" r="1.2" fill="#cfe6ff" style="animation-duration:2.62s;animation-delay:3.31s"/>
<circle class="tw" cx="640" cy="100" r="1.2" fill="#cfe6ff" style="animation-duration:3.45s;animation-delay:2.52s"/>
<circle class="tw" cx="720" cy="40" r="1.2" fill="#cfe6ff" style="animation-duration:3.11s;animation-delay:2.31s"/>

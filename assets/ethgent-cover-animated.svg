<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Ethgent: AI-powered multi-agent automation orchestrator">
<title>Ethgent</title>
<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.ring{fill:none;stroke:#5ab8ff;stroke-width:1.6;opacity:0;transform-origin:400px 235px;animation:ring 4.8s ease-out infinite}
@keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.7)}}
.beacon{fill:#9fe3ff;transform-origin:400px 150px;animation:beacon 2s ease-in-out infinite}
@keyframes beacon{0%,100%{opacity:.0;transform:scale(1)}50%{opacity:.55;transform:scale(2.2)}}
.plat{fill:none;stroke:#35d6ff;stroke-width:2;transform-origin:400px 338px;animation:plat 3.2s ease-in-out infinite}
@keyframes plat{0%,100%{opacity:.1;transform:scale(.96)}50%{opacity:.6;transform:scale(1.04)}}
.blink{opacity:0;animation:blink 5s infinite}
@keyframes blink{0%,90%,96%,100%{opacity:0}92%,94%{opacity:1}}
.glow{fill:#00f0ff;opacity:0;animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.10}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<image width="800" height="450" xlink:href="data:image/webp;base64,"/>
<circle class="tw" cx="70" cy="40" r="1.6" fill="#cfe6ff" style="animation-duration:3.11s;animation-delay:3.79s"/>
